<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>약속 가능 시간 등록</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { padding: 16px; background-color: #f8f9fa; margin: 0; }
    .card { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; font-size: 1.3rem; text-align: center; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.95rem; }
    
    .grid-container { max-height: 420px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 8px; margin-top: 10px; }
    .slot-table { width: 100%; border-collapse: collapse; user-select: none; }
    .slot-table th, .slot-table td { border-bottom: 1px solid #e9ecef; text-align: center; padding: 10px 4px; font-size: 0.85rem; }
    .slot-table th { background: #f1f3f5; position: sticky; top: 0; z-index: 2; }
    .slot-cell { cursor: pointer; transition: background 0.1s; }
    .slot-cell.active { background-color: #4dabf7; color: white; font-weight: bold; }
    
    .char-badge { display: inline-block; background: #e7f5ff; color: #1971c2; padding: 4px 8px; border-radius: 4px; margin: 2px; font-size: 0.85rem; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 15px; }
    .btn-submit { background-color: #228be6; color: white; }
    .btn-submit:hover { background-color: #1c7ed6; }
    .btn-secondary { background-color: #ced4da; color: #333; margin-top: 6px; }
  </style>
</head>
<body>

<div class="card">
  <h2>약속 가능 시간 등록</h2>

  <div class="form-group">
    <label>그룹명 (본인 닉네임/유저명)</label>
    <input type="text" id="groupName" placeholder="예: 길동">
  </div>

  <div class="form-group">
    <label>참여 캐릭터 추가</label>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="charInput" placeholder="캐릭터명 입력">
      <button class="btn btn-secondary" style="width: auto; margin:0;" onclick="addCharacter()">추가</button>
    </div>
    <div id="charList" style="margin-top: 8px;"></div>
  </div>

  <div class="form-group" id="charSelectGroup" style="display:none;">
    <label>현재 시간을 지정할 캐릭터 선택</label>
    <select id="charSelect" style="width: 100%; padding: 8px; border-radius: 6px;" onchange="loadCharSchedule()">
    </select>
  </div>

  <label>가능 시간 선택 (터치/클릭하여 활성화)</label>
  <div class="grid-container">
    <table class="slot-table">
      <thead>
        <tr>
          <th style="width: 45%;">시간대</th>
          <th>선택</th>
        </tr>
      </thead>
      <tbody id="slotBody"></tbody>
    </table>
  </div>

  <button class="btn btn-submit" onclick="submitData()">일정 제출하기</button>
</div>

<script>
  // 1. 기준 시간 슬롯 생성 (예시: 18:00 ~ 23:40, 20분 단위)
  const timeSlots = [];
  const startHour = 18;
  const endHour = 24;

  for (let h = startHour; h < endHour; h++) {
    for (let m = 0; m < 60; m += 20) {
      const hh = String(h).padStart(2, '0');
      const mm = String(m).padStart(2, '0');
      timeSlots.push(`${hh}:${mm}`);
    }
  }

  const characters = [];
  const schedules = {}; // { charName: Set(slot_indexes) }

  // 테이블 렌더링
  const tbody = document.getElementById('slotBody');
  timeSlots.forEach((slot, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${slot}</td>
      <td class="slot-cell" data-index="${index}" onclick="toggleSlot(${index})">선택 안 함</td>
    `;
    tbody.appendChild(tr);
  });

  function addCharacter() {
    const input = document.getElementById('charInput');
    const name = input.value.trim();
    if (!name || characters.includes(name)) return;

    characters.push(name);
    schedules[name] = new Set();
    input.value = '';
    
    renderCharBadges();
    updateCharSelect();
  }

  function renderCharBadges() {
    const container = document.getElementById('charList');
    container.innerHTML = characters.map(c => `<span class="char-badge">${c}</span>`).join('');
  }

  function updateCharSelect() {
    const select = document.getElementById('charSelect');
    const group = document.getElementById('charSelectGroup');
    if (characters.length > 0) {
      group.style.display = 'block';
      select.innerHTML = characters.map(c => `<option value="${c}">${c}</option>`).join('');
      loadCharSchedule();
    }
  }

  function toggleSlot(index) {
    const char = document.getElementById('charSelect').value;
    if (!char) {
      alert('캐릭터를 먼저 추가해주세요.');
      return;
    }

    const currentSet = schedules[char];
    if (currentSet.has(index)) {
      currentSet.delete(index);
    } else {
      currentSet.add(index);
    }
    updateCellUI(index, currentSet.has(index));
  }

  function updateCellUI(index, isActive) {
    const cell = document.querySelector(`.slot-cell[data-index="${index}"]`);
    if (isActive) {
      cell.classList.add('active');
      cell.innerText = '가능';
    } else {
      cell.classList.remove('active');
      cell.innerText = '선택 안 함';
    }
  }

  function loadCharSchedule() {
    const char = document.getElementById('charSelect').value;
    const currentSet = schedules[char] || new Set();
    timeSlots.forEach((_, idx) => {
      updateCellUI(idx, currentSet.has(idx));
    });
  }

  function submitData() {
    const groupName = document.getElementById('groupName').value.trim();
    if (!groupName) {
      alert('그룹명을 입력하세요.');
      return;
    }
    if (characters.length === 0) {
      alert('캐릭터를 1개 이상 추가해야 합니다.');
      return;
    }

    const payload = {
      group: groupName,
      characters: {}
    };

    characters.forEach(c => {
      payload.characters[c] = Array.from(schedules[c]).sort((a,b) => a - b);
    });

    // 백엔드 API 연동 전 테스트용 콘솔 출력 및 알림
    console.log("전송 데이터:", JSON.stringify(payload, null, 2));
    alert("데이터가 준비되었습니다. (F12 콘솔 확인 가능)\n백엔드 API 주소를 연결하면 서버로 전송됩니다.");
    
    /* // 실제 백엔드 연동 시:
    fetch('https://your-api-server.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(res => alert('제출 완료!'));
    */
  }
</script>
</body>
</html>
